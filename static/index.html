<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini-RAG</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='4' width='20' height='24' rx='2' fill='%23c2621f'/%3E%3Ccircle cx='22' cy='22' r='6' fill='none' stroke='%23fff7ec' stroke-width='2.5'/%3E%3Cline x1='26' y1='26' x2='30' y2='30' stroke='%23fff7ec' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #eef0f3;
    --surface: #ffffff;
    --surface-2: #f6f7f9;
    --border: #dde0e6;
    --text: #14171c;
    --text-muted: #5b606c;
    --accent: #c2621f;
    --accent-contrast: #fff7ec;
    --danger: #b3432f;
    --radius: 6px;
    --shadow: 0 1px 2px rgba(20, 23, 28, 0.05), 0 12px 32px rgba(20, 23, 28, 0.07);

    --font-display: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161b;
      --surface: #1b1e24;
      --surface-2: #20232a;
      --border: #2a2d35;
      --text: #eef0f3;
      --text-muted: #9296a3;
      --accent: #e08a3c;
      --accent-contrast: #1a1206;
      --danger: #e2685a;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 12px 32px rgba(0, 0, 0, 0.45);
    }
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    display: flex;
    justify-content: center;
    padding: clamp(1rem, 4vw, 2.5rem);
  }

  ::selection {
    background: var(--accent);
    color: var(--accent-contrast);
  }

  .app {
    width: 100%;
    max-width: 700px;
    display: flex;
    flex-direction: column;
    height: calc(100vh - clamp(2rem, 8vw, 5rem));
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    gap: 0.85rem;
    padding: 1.1rem 1.4rem;
    border-bottom: 1px solid var(--border);
  }

  .mark {
    color: var(--accent);
    flex-shrink: 0;
    line-height: 0;
  }

  .heading h1 {
    margin: 0;
    font-family: var(--font-display);
    font-size: 1.3rem;
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  .heading .eyebrow {
    margin: 0.15rem 0 0;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 1.4rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  #messages:empty::before {
    content: "Posez une question sur le corpus indexé pour commencer.";
    color: var(--text-muted);
    font-size: 0.88rem;
    font-style: italic;
    margin: auto;
    text-align: center;
    max-width: 30ch;
  }

  .msg {
    max-width: 78%;
    padding: 0.68rem 0.95rem;
    border-radius: var(--radius);
    line-height: 1.55;
    font-size: 0.93rem;
    white-space: pre-wrap;
    animation: rise 0.22s ease-out;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user {
    align-self: flex-end;
    background: var(--accent);
    color: var(--accent-contrast);
    border-bottom-right-radius: 2px;
  }

  .msg.assistant {
    align-self: flex-start;
    background: var(--surface-2);
    color: var(--text);
    border-left: 2px solid var(--border);
    border-bottom-left-radius: 2px;
  }

  .msg.assistant.error {
    border-left-color: var(--danger);
    color: var(--danger);
  }

  .typing {
    align-self: flex-start;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.68rem 0.95rem;
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--text-muted);
  }

  .cursor {
    animation: blink 1s steps(1) infinite;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  form {
    display: flex;
    gap: 0.6rem;
    padding: 1rem 1.4rem;
    border-top: 1px solid var(--border);
  }

  input {
    flex: 1;
    padding: 0.65rem 0.9rem;
    font-family: var(--font-body);
    font-size: 0.95rem;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface-2);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }

  input:focus-visible {
    border-color: var(--accent);
  }

  button {
    padding: 0.65rem 1.1rem;
    font-family: var(--font-mono);
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border: none;
    border-radius: var(--radius);
    background: var(--accent);
    color: var(--accent-contrast);
    cursor: pointer;
    transition: opacity 0.15s;
  }

  button:hover:not(:disabled) {
    opacity: 0.88;
  }

  button:focus-visible,
  input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  .hint {
    margin: 0;
    padding: 0 1.4rem 0.95rem;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.03em;
    color: var(--text-muted);
    text-align: center;
  }

  #messages::-webkit-scrollbar {
    width: 8px;
  }

  #messages::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 4px;
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      animation-duration: 0.001ms !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <span class="mark" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 32 32" fill="none">
          <rect x="4" y="4" width="20" height="24" rx="2" fill="currentColor"/>
          <circle cx="22" cy="22" r="6" fill="none" stroke="var(--surface)" stroke-width="2.5"/>
          <line x1="26" y1="26" x2="30" y2="30" stroke="var(--surface)" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </span>
      <div class="heading">
        <h1>Mini-RAG</h1>
        <p class="eyebrow">Recherche &amp; réponse — base indexée</p>
      </div>
    </header>

    <div id="messages" role="log" aria-live="polite"></div>

    <form id="ask-form">
      <input id="question" type="text" placeholder="Pose ta question…" autocomplete="off" required>
      <button id="submit-btn" type="submit">Envoyer</button>
    </form>
    <p class="hint">Réponses fondées uniquement sur la base de connaissances indexée.</p>
  </div>

  <script>
    const form = document.getElementById("ask-form");
    const input = document.getElementById("question");
    const submitBtn = document.getElementById("submit-btn");
    const messages = document.getElementById("messages");

    function addMessage(role, text) {
      const el = document.createElement("div");
      el.className = `msg ${role}`;
      el.textContent = text;
      messages.appendChild(el);
      messages.scrollTop = messages.scrollHeight;
      return el;
    }

    function showTyping() {
      const el = document.createElement("div");
      el.className = "typing";
      el.innerHTML = '<span class="cursor">▍</span><span>recherche dans la base…</span>';
      messages.appendChild(el);
      messages.scrollTop = messages.scrollHeight;
      return el;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const question = input.value.trim();
      if (!question) return;

      addMessage("user", question);
      input.value = "";
      input.disabled = true;
      submitBtn.disabled = true;

      const typingEl = showTyping();

      try {
        const response = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });

        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const data = await response.json();
        typingEl.remove();
        addMessage("assistant", data.answer);
      } catch (err) {
        typingEl.remove();
        addMessage("assistant error", "Erreur : impossible de contacter le serveur.");
      } finally {
        input.disabled = false;
        submitBtn.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
